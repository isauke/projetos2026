<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        article {
            width: min(100%, 420px);
            min-height: 160px;
            padding: 16px;
            border: 1px solid #000;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }
        #foto-usuario {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            border-radius: 50%;
            object-fit: cover;
        }
        article > div {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        article h1 {
            font-size: 1.15rem;
            line-height: 1.2;
            overflow-wrap: anywhere;
        }
        article h2 {
            font-size: 0.95rem;
            line-height: 1.3;
        }
        article p {
            color: #444;
            font-size: 0.9rem;
            line-height: 1.35;
        }
        #info {
            display: flex;
            flex: 1;
            min-width: 0;
            flex-direction: column;
            gap: 6px;
        }
        #skills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
            font-size: 0.8rem;
            line-height: 1;
        }
        #skills span {
            padding: 5px 8px;
            border-radius: 4px;
            background-color: #5929b9;
            color: #fff;
        }
    </style>
</head>
<body>
    <article>
        <img id="foto-usuario" src="cachorro.jpg" alt="Foto do usuário">
        <div>
            <div id="info">
                <h1>Isaque Carvalho da Silva</h1>
                <p>Desenvolvedor Web em formação</p>
                <h2>Curso técnico em Informática</h2>
                <p>IFPI Campus Angical</p>
            </div>
            <div id="skills" aria-label="Habilidades">
                <span>HTML</span>
                <span>CSS</span>
                <span>JavaScript</span>
            </div>
        </div>
    </article>
</body>
</html>
