<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stepper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ol>
        <li class="step done">
            <div class="ball">
                <p>1</p>
            </div>
            <div class="label">Dados pessoais</div>
        </li>
        <li class="step active">
            <div class="ball">
                <p>2</p>
            </div>
            <div class="label">Endereço</div>
        </li>
        <li class="step pending">
            <div class="ball">
                <p>3</p>
            </div>
            <div class="label">Pagamento</div>
        </li>
        <li class="step pending">
            <div class="ball">
                <p>4</p>
            </div>
            <div class="label">Confirmação</div>
        </li>
    </ol>
</body>
</html>
